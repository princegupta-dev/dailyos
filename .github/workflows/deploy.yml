name: Deploy to GitHub Pages

# Every push to main is checked and, only if everything passes, published at
# https://<owner>.github.io/<repo>/. Can also be started by hand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, format, types, unit tests, build
        run: pnpm check
      # Install Chrome explicitly rather than relying on what the runner image ships with,
      # so the job keeps working as ubuntu-latest moves to newer Ubuntu releases.
      - name: Install Google Chrome for end-to-end tests
        run: pnpm exec playwright install --with-deps chrome
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Build for the Pages sub-path
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
